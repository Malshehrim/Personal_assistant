{% extends 'base.html' %}

{% block content %}
<div class="dashboard-container">

    <section class="tasks-section completed-section">
        <div class="section-header">
            <h3>الأرشيف: المهام المنجزة</h3>
            <span class="count-badge count-green">{{ completed|length }}</span>
        </div>

        <div class="tasks-list">
            {% for task in completed %}
            <div class="task-card card-dimmed">
                <div class="task-info">
                    <span class="task-title">{{ task.title }}</span>
                    <span class="task-date">تم الإنجاز</span>
                </div>
                <!-- Form to Undo -->
                <form action="/toggle_task/{{ task.id }}" method="POST">
                    <button type="submit" class="btn-undo" title="إعادة للمهام">↩</button>
                </form>
            </div>
            {% else %}
            <p class="empty-msg">لم تنجز أي مهام بعد.</p>
            {% endfor %}
        </div>

        <div style="text-align: center; margin-top: 2rem;">
            <a href="/" class="back-link">← العودة للوحة المهام</a>
        </div>
    </section>

</div>
{% endblock %}
